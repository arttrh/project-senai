# Perfil de teste.
#
# Este arquivo era src/test/resources/application.properties e, por ter o mesmo
# nome do arquivo principal, substituia o application.properties de main inteiro
# no classpath de teste: nenhuma configuracao real (actuator, cookie de sessao,
# Flyway, logs) era exercitada pelos testes, e um erro nessas linhas so
# apareceria no primeiro boot em producao.
#
# Como perfil, o arquivo principal continua valendo e aqui ficam apenas as
# diferencas de ambiente: banco em memoria no lugar do MySQL.
spring.datasource.url=jdbc:h2:mem:cantina;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Sem ADMIN automatico: cada teste monta os dados de que precisa.
app.admin-inicial.email=
app.admin-inicial.senha=

logging.level.br.com.cantina.senai=WARN
logging.level.org.springframework=WARN
logging.level.org.flywaydb=WARN
