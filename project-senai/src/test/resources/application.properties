# O contextLoads sobe a aplicacao inteira, entao ele precisa de um banco.
# Em memoria, para o teste nao depender de um MySQL rodando na maquina
# (nem no runner do CI, onde nao existe nenhum).
spring.datasource.url=jdbc:h2:mem:cantina;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
