# Perfil de teste: H2 em memoria no modo MySQL, com as mesmas migrations do
# Flyway que rodam em producao. Assim o teste valida o schema real em vez de um
# schema gerado pelo Hibernate que pode divergir do que esta no banco.
spring.datasource.url=jdbc:h2:mem:cantina;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=false

# Sem ADMIN automatico nos testes: cada teste monta os dados de que precisa.
app.admin-inicial.email=
app.admin-inicial.senha=

logging.level.br.com.cantina.senai=WARN
logging.level.org.springframework=WARN
