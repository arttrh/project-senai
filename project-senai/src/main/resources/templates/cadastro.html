<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cadastro – Cantina SENAI</title>
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body>

<div class="screen">
    <div class="card" style="max-width: 440px;">

        <div class="logo-area">
            <div class="senai-badge">
                <div class="senai-block">SENAI</div>
                <div class="senai-divider"></div>
                <div class="senai-sub">
                    <div class="line1">Sistema</div>
                    <div class="line2">Cantina SENAI</div>
                </div>
            </div>
            <p>Crie sua conta para continuar</p>
        </div>

        <!--
            O seletor de perfil (Usuário / Funcionário / Admin) saiu daqui de
            propósito: quem se cadastra sozinho entra sempre como usuário, e a
            promoção a funcionário ou admin é feita por um administrador. Deixar
            o tipo no formulário permitia a qualquer visitante criar uma conta
            de administrador para si mesmo.
        -->
        <form th:action="@{/usuario/cadastrar}" th:object="${dados}" method="post">

            <p class="erro-msg" th:if="${erro}" th:text="${erro}"></p>

            <div class="form-row-2">
                <div class="form-group">
                    <label for="nome">Nome completo</label>
                    <input type="text" id="nome" th:field="*{nome}"
                           placeholder="Seu nome completo" required autocomplete="name"/>
                    <span class="erro-campo" th:if="${#fields.hasErrors('nome')}"
                          th:errors="*{nome}"></span>
                </div>
                <div class="form-group">
                    <label for="cpf">CPF</label>
                    <input type="text" id="cpf" th:field="*{cpf}"
                           placeholder="000.000.000-00" required inputmode="numeric" maxlength="14"/>
                    <span class="erro-campo" th:if="${#fields.hasErrors('cpf')}"
                          th:errors="*{cpf}"></span>
                </div>
            </div>

            <div class="form-group">
                <label for="telefone">Telefone</label>
                <input type="text" id="telefone" th:field="*{telefone}"
                       placeholder="(11) 99999-9999" autocomplete="tel"/>
                <span class="erro-campo" th:if="${#fields.hasErrors('telefone')}"
                      th:errors="*{telefone}"></span>
            </div>

            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" th:field="*{email}"
                       placeholder="exemplo@email.com" required autocomplete="email"/>
                <span class="erro-campo" th:if="${#fields.hasErrors('email')}"
                      th:errors="*{email}"></span>
            </div>

            <div class="form-group">
                <label for="senha">Senha</label>
                <input type="password" id="senha" th:field="*{senha}"
                       placeholder="Mínimo de 8 caracteres" required minlength="8"
                       autocomplete="new-password"/>
                <span class="erro-campo" th:if="${#fields.hasErrors('senha')}"
                      th:errors="*{senha}"></span>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn-entrar">Criar conta</button>
            </div>
        </form>

        <div class="divider"><span>ou</span></div>

        <a class="btn-cadastro" th:href="@{/login}">Já tenho uma conta</a>

        <div class="footer-bar"></div>
    </div>
</div>

</body>
</html>
