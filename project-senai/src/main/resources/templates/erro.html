<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo} ?: 'Erro'">Erro – Cantina SENAI</title>
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body>

<div class="screen">
    <div class="card">
        <div class="logo-area">
            <div class="senai-badge">
                <div class="senai-block">SENAI</div>
                <div class="senai-divider"></div>
                <div class="senai-sub">
                    <div class="line1">Sistema</div>
                    <div class="line2">Cantina SENAI</div>
                </div>
            </div>
        </div>

        <p class="modal-titulo" th:text="${titulo} ?: 'Algo deu errado'">Algo deu errado</p>
        <p class="erro-msg" th:text="${mensagem} ?: 'Tente novamente em instantes.'"></p>

        <div class="form-actions" style="margin-top:1.25rem">
            <a class="btn-entrar" th:href="@{/}" style="display:block;text-align:center;
               text-decoration:none;line-height:42px">Voltar ao início</a>
        </div>

        <div class="footer-bar"></div>
    </div>
</div>

</body>
</html>
