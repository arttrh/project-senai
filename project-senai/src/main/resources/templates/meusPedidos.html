<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Meus pedidos – Cantina SENAI</title>
    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link rel="stylesheet" th:href="@{/css/funcionario.css}">
</head>
<body>

<nav class="navbar">
    <div class="nav-logo">
        <div class="senai-block">SENAI</div>
        <div class="nav-divider"></div>
        <span class="nav-titulo">Cantina SENAI</span>
    </div>
    <div class="nav-right">
        <div class="nav-user">
            <div class="nav-avatar"
                 th:text="${#strings.toUpperCase(#strings.substring(nomeUsuario, 0, 2))}">US</div>
            <span th:text="${nomeUsuario}">Usuário</span>
        </div>
        <a class="btn-voltar" th:href="@{/home}">← Voltar ao cardápio</a>
    </div>
</nav>

<div class="page">
    <div class="page-header">
        <p class="page-eyebrow">Acompanhamento</p>
        <h1 class="page-title">Meus pedidos</h1>
    </div>

    <div class="pedidos-grid" id="listaPedidos"></div>
    <p class="vazio" id="vazioPedidos" style="display:none">
        Você ainda não fez nenhum pedido.
    </p>
</div>

<div class="toast" id="toast"></div>

<script th:src="@{/js/app.js}"></script>
<script th:src="@{/js/meusPedidos.js}"></script>
</body>
</html>
