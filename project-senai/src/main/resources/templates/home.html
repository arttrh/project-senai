<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cardápio – Cantina SENAI</title>
    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link rel="stylesheet" th:href="@{/css/home.css}">
</head>
<body>

<nav class="navbar">
    <div class="nav-logo">
        <div class="senai-block">SENAI</div>
        <div class="nav-divider"></div>
        <span class="nav-titulo">Cantina SENAI</span>
    </div>
    <!-- Antes havia dois blocos de usuário na navbar, um fixo com "Usuário"
         e outro que o JS preenchia a partir do sessionStorage. Agora o nome
         vem do servidor, da sessão autenticada. -->
    <div class="nav-right">
        <a class="btn-sair" th:href="@{/pedido/meus}">Meus pedidos</a>
        <div class="nav-user">
            <div class="nav-avatar"
                 th:text="${#strings.toUpperCase(#strings.substring(nomeUsuario, 0, 2))}">US</div>
            <span th:text="${nomeUsuario}">Usuário</span>
        </div>
        <a class="btn-sair" th:href="@{/configuracoes}">Conta</a>
        <form th:action="@{/logout}" method="post" style="display:inline">
            <button type="submit" class="btn-sair">Sair</button>
        </form>
    </div>
</nav>

<div class="hero">
    <p class="hero-eyebrow">Cardápio do dia</p>
    <h1 class="hero-title">O que vai querer hoje?</h1>
    <p class="hero-sub" id="dataHoje"></p>
</div>

<div class="filtros-wrap">
    <input class="search-input" type="text" placeholder="Buscar item..."
           id="busca" oninput="filtrar()" aria-label="Buscar item"/>
    <button class="filtro-btn active" onclick="setCategoria('todos', this)">Todos</button>
    <button class="filtro-btn" onclick="setCategoria('LANCHE', this)">Lanche</button>
    <button class="filtro-btn" onclick="setCategoria('BEBIDA', this)">Bebida</button>
    <button class="filtro-btn" onclick="setCategoria('SOBREMESA', this)">Sobremesa</button>
</div>

<div class="main">
    <div class="section-label">Itens disponíveis</div>
    <!-- O grid é montado por home.js a partir de /api/produtos, que já traz
         preço, categoria e saldo em estoque. -->
    <div class="card-grid" id="grid"></div>
    <p class="vazio" id="vazio" style="display:none;">Nenhum item encontrado.</p>
</div>

<div class="cart-bar hidden" id="cartBar">
    <div class="cart-info">
        <div class="cart-badge" id="cartQtd">0</div>
        <span id="cartLabel">itens</span>
    </div>
    <span class="cart-total" id="cartTotal">R$ 0,00</span>
    <a class="btn-finalizar" th:href="@{/pedido/finalizar}">Ver pedido →</a>
</div>

<div class="toast" id="toast"></div>

<script th:src="@{/js/app.js}"></script>
<script th:src="@{/js/home.js}"></script>
</body>
</html>
