<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Finalizar Pedido – Cantina SENAI</title>
    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link rel="stylesheet" th:href="@{/css/finalizarPedido.css}">
</head>
<body>

<nav class="navbar">
    <div class="nav-logo">
        <div class="senai-block">SENAI</div>
        <div class="nav-divider"></div>
        <span class="nav-titulo">Cantina SENAI</span>
    </div>
    <a class="btn-voltar" th:href="@{/home}">← Voltar ao cardápio</a>
</nav>

<div class="page">
    <div class="page-header">
        <p class="page-eyebrow">Revisão do pedido</p>
        <h1 class="page-title">Finalizar pedido</h1>
    </div>

    <div>
        <div class="card">
            <div class="card-header">
                <span class="card-header-titulo">Itens selecionados</span>
                <span class="card-header-badge" id="qtdBadge">0 itens</span>
            </div>
            <div class="item-lista" id="listaItens">
                <p class="vazio-msg">Carregando...</p>
            </div>
        </div>
    </div>

    <div class="resumo-card">
        <div class="card" style="margin-bottom:14px">
            <div class="card-header">
                <span class="card-header-titulo">Forma de pagamento</span>
            </div>
            <!-- data-forma casa com o enum FormaPagamento do back. Antes o JS
                 mandava o rótulo visível ("Cartão"), que o servidor não aceita. -->
            <div class="pagamento-opts">
                <button class="pag-btn selected" data-forma="CARTAO" onclick="setPag(this)">
                    <span class="pag-icon">💳</span>
                    <span class="pag-label">Cartão</span>
                </button>
                <button class="pag-btn" data-forma="DINHEIRO" onclick="setPag(this)">
                    <span class="pag-icon">💵</span>
                    <span class="pag-label">Dinheiro</span>
                </button>
                <button class="pag-btn" data-forma="PIX" onclick="setPag(this)">
                    <span class="pag-icon">📱</span>
                    <span class="pag-label">Pix</span>
                </button>
                <button class="pag-btn" data-forma="SALDO_SENAI" onclick="setPag(this)">
                    <span class="pag-icon">🏫</span>
                    <span class="pag-label">Saldo SENAI</span>
                </button>
            </div>
            <div class="obs-wrap">
                <label class="obs-label" for="observacao">Observações (opcional)</label>
                <textarea class="obs-input" id="observacao" rows="2" maxlength="255"
                          placeholder="Ex: sem cebola, alergia a glúten..."></textarea>
            </div>
        </div>

        <div class="card">
            <div id="resumoLinhas"></div>
            <div class="resumo-total-linha">
                <span class="resumo-total-label">Total</span>
                <span class="resumo-total-valor" id="totalValor">R$ 0,00</span>
            </div>
            <button class="btn-confirmar" id="btnConfirmar" onclick="confirmar()" disabled>
                Confirmar pedido
            </button>
        </div>
    </div>
</div>

<div class="modal-overlay" id="modalSucesso">
    <div class="modal">
        <div class="modal-icon">✅</div>
        <p class="modal-titulo">Pedido enviado!</p>
        <p class="modal-sub">Seu pedido foi recebido e está sendo preparado.</p>
        <p class="modal-num" id="numPedido">#0000</p>
        <p class="modal-num-label">Número do pedido</p>
        <button class="btn-modal" onclick="window.location.href='/pedido/meus'">
            Acompanhar pedido
        </button>
    </div>
</div>

<div class="toast" id="toast"></div>

<script th:src="@{/js/app.js}"></script>
<script th:src="@{/js/finalizarPedido.js}"></script>
</body>
</html>
