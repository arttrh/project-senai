spring.application.name=cantina-senai

# ---------------------------------------------------------------------------
# Banco de dados
# Todos os valores vem do ambiente (ver .env.example). Nenhuma credencial fica
# no repositorio; os defaults servem so para rodar local.
# ---------------------------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/cantinasenai?useSSL=false&serverTimezone=America/Sao_Paulo}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:cantina}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.connection-timeout=${DB_POOL_TIMEOUT_MS:20000}

# ---------------------------------------------------------------------------
# JPA
# ddl-auto=validate, nao update: o schema e responsabilidade do Flyway e o
# Hibernate apenas confere se o mapeamento bate. Com "update" o Hibernate
# alterava o banco sozinho no boot, sem historico e sem rollback.
# ---------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true

# ---------------------------------------------------------------------------
# Flyway
# ---------------------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ---------------------------------------------------------------------------
# Servidor
# ---------------------------------------------------------------------------
server.port=${SERVER_PORT:8080}
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.servlet.session.timeout=${SESSION_TIMEOUT:30m}
server.shutdown=graceful

spring.thymeleaf.cache=${THYMELEAF_CACHE:true}

# ---------------------------------------------------------------------------
# Observabilidade
# health e info sao publicos (usados pelo Docker/orquestrador); o restante
# exige ADMIN, ver SecurityConfig.
# ---------------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.metrics.tags.application=${spring.application.name}
management.info.env.enabled=true
info.app.nome=Cantina SENAI
info.app.descricao=Sistema de pedidos e estoque da cantina

# ---------------------------------------------------------------------------
# Logs
# O correlationId vem do CorrelationIdFilter e amarra todas as linhas de uma
# mesma requisicao.
# ---------------------------------------------------------------------------
logging.pattern.level=%5p [${spring.application.name},%X{correlationId:-},%X{usuario:-}]
logging.level.br.com.cantina.senai=${LOG_LEVEL_APP:INFO}
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=${LOG_LEVEL_SQL:WARN}

# ---------------------------------------------------------------------------
# Administrador inicial (criado no boot se ainda nao existir nenhum ADMIN).
# Deixe em branco para nao criar. Ver AdministradorInicialRunner.
# ---------------------------------------------------------------------------
app.admin-inicial.nome=${APP_ADMIN_NOME:Administrador}
app.admin-inicial.cpf=${APP_ADMIN_CPF:}
app.admin-inicial.email=${APP_ADMIN_EMAIL:}
app.admin-inicial.senha=${APP_ADMIN_SENHA:}
