# Pipeline da Cantina SENAI.
#
# O workflow anterior rodava so em push/PR para master, executava
# "mvn package" e nada mais: um branch de trabalho nao era verificado ate
# virar PR, e nem o Docker nem as migrations em MySQL eram checados.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  # Push novo no mesmo branch cancela a execucao anterior.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "21"
  DIRETORIO_APP: project-senai

permissions:
  contents: read

jobs:
  # ── Build, testes e cobertura (H2) ───────────────────────────────────────
  build:
    name: Build e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Compilar e testar
        run: mvn -B -ntp verify --file ${{ env.DIRETORIO_APP }}/pom.xml

      - name: Publicar resultados dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-de-teste
          path: ${{ env.DIRETORIO_APP }}/target/surefire-reports/
          retention-days: 7

      - name: Publicar relatorio de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-jacoco
          path: ${{ env.DIRETORIO_APP }}/target/site/jacoco/
          retention-days: 7

      - name: Resumo da cobertura
        if: always()
        run: |
          RELATORIO="${{ env.DIRETORIO_APP }}/target/site/jacoco/jacoco.csv"
          if [ ! -f "$RELATORIO" ]; then
            echo "Relatorio de cobertura nao gerado." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          awk -F, 'NR>1 {perdidas+=$8; cobertas+=$9}
                   END {
                     total = perdidas + cobertas
                     if (total > 0)
                       printf "## Cobertura\n\nLinhas cobertas: **%.1f%%** (%d de %d)\n",
                              100*cobertas/total, cobertas, total
                   }' "$RELATORIO" >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar o jar para o job de Docker
        uses: actions/upload-artifact@v4
        with:
          name: aplicacao-jar
          path: ${{ env.DIRETORIO_APP }}/target/*.jar
          retention-days: 1

  # ── Migrations contra o MySQL de verdade ─────────────────────────────────
  # O resto da suite roda em H2 (modo MySQL). Este job garante que as migrations
  # tambem sobem no banco de producao e que o Hibernate valida o mapeamento la.
  migrations-mysql:
    name: Migrations no MySQL
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: raiz-do-ci
          MYSQL_DATABASE: cantinasenai
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -praiz-do-ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Aplicar e validar as migrations
        env:
          MYSQL_TEST_URL: jdbc:mysql://127.0.0.1:3306/cantinasenai?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
          MYSQL_TEST_USER: root
          MYSQL_TEST_PASSWORD: raiz-do-ci
        run: |
          mvn -B -ntp test -Dtest=MigrationsMySqlTest -DfailIfNoTests=false \
            --file ${{ env.DIRETORIO_APP }}/pom.xml

  # ── Imagem Docker ────────────────────────────────────────────────────────
  docker:
    name: Imagem Docker
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir a imagem
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.DIRETORIO_APP }}
          push: false
          load: true
          tags: cantina-senai:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Build que compila nao prova nada: o container precisa subir e responder.
      - name: Subir o container e conferir o health check
        run: |
          docker network create rede-cantina

          # O -h 127.0.0.1 no health check e proposital: durante a
          # inicializacao o entrypoint do MySQL sobe um servidor temporario que
          # escuta so no socket unix e depois o derruba para subir o definitivo.
          # Um "mysqladmin ping" pelo socket passa nessa janela, mas a aplicacao
          # conecta por TCP e encontra a porta fechada -- foi assim que este job
          # falhou com "Communications link failure" logo no Flyway.
          docker run -d --name banco --network rede-cantina \
            -e MYSQL_ROOT_PASSWORD=raiz-do-ci \
            -e MYSQL_DATABASE=cantinasenai \
            --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -praiz-do-ci --silent" \
            --health-interval=5s \
            --health-timeout=5s \
            --health-retries=20 \
            --health-start-period=20s \
            mysql:8.4

          echo "Aguardando o MySQL ficar healthy..."
          for tentativa in $(seq 1 60); do
            estado=$(docker inspect --format='{{.State.Health.Status}}' banco 2>/dev/null || echo starting)
            if [ "$estado" = "healthy" ]; then
              echo "MySQL healthy."
              break
            fi
            if [ "$tentativa" -eq 60 ]; then
              echo "::error::O MySQL nao ficou healthy a tempo."
              docker logs banco
              exit 1
            fi
            sleep 2
          done

          # Ultima confirmacao, pela mesma rota que a aplicacao usa: uma consulta
          # de verdade, por TCP, a partir de outro container.
          echo "Confirmando conexao TCP..."
          docker run --rm --network rede-cantina mysql:8.4 \
            mysql -h banco -uroot -praiz-do-ci -e "SELECT 1" > /dev/null
          echo "MySQL aceitando conexao TCP."

          docker run -d --name aplicacao --network rede-cantina -p 8080:8080 \
            -e SPRING_DATASOURCE_URL="jdbc:mysql://banco:3306/cantinasenai?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC" \
            -e SPRING_DATASOURCE_USERNAME=root \
            -e SPRING_DATASOURCE_PASSWORD=raiz-do-ci \
            -e APP_ADMIN_EMAIL=admin@senai.br \
            -e APP_ADMIN_SENHA=senhaDoCI2024 \
            cantina-senai:${{ github.sha }}

          echo "Aguardando a aplicacao..."
          for tentativa in $(seq 1 60); do
            if curl -fsS http://localhost:8080/actuator/health 2>/dev/null | grep -q '"status":"UP"'; then
              echo "Aplicacao no ar e saudavel."
              curl -sS http://localhost:8080/actuator/health
              exit 0
            fi
            sleep 3
          done

          echo "::error::A aplicacao nao ficou saudavel a tempo."
          docker logs aplicacao
          exit 1

      - name: Logs em caso de falha
        if: failure()
        run: |
          echo "── aplicacao ──"; docker logs aplicacao 2>&1 | tail -80 || true
          echo "── banco ──";     docker logs banco     2>&1 | tail -40 || true

  # ── Higiene do repositorio ───────────────────────────────────────────────
  seguranca:
    name: Verificacoes de seguranca
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Procurar segredos versionados
        run: |
          # A senha do banco tem de vir do ambiente, nunca do repositorio.
          PADRAO='(password|senha|secret)[[:space:]]*[:=][[:space:]]*["'"'"']?[A-Za-z0-9@#$%^&*]{8,}'
          PERMITIDOS='\$\{|senhaSegura1|senhaAntiga1|senhaNova123|senhaErrada123|hashfake|raiz-do-ci|senhaDoCI2024|Senha atual|senha atual|nova senha|Nova senha|confirmarSenha|senhaAtual'
          if grep -rInE "$PADRAO" \
               --include='*.properties' --include='*.yml' --include='*.yaml' \
               --include='*.java' --include='*.sql' \
               ${{ env.DIRETORIO_APP }}/src .github 2>/dev/null \
             | grep -vE "$PERMITIDOS" ; then
            echo "::error::Possivel segredo versionado (as linhas acima)."
            exit 1
          fi
          echo "Nenhum segredo aparente no repositorio."

      - name: Conferir que o .env nao foi versionado
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::O .env guarda credenciais e nao pode ser versionado."
            exit 1
          fi
          echo ".env corretamente fora do versionamento."
